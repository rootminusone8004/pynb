name: Build & Release APK

# Releases are published ONLY from version tags (vX.Y.Z), and the APK is built from exactly
# the tagged commit. F-Droid builds the same tag and checks that its build matches the
# published APK byte for byte (reproducible builds), so the two must never diverge.
#
# Branch pushes and pull requests only verify: version files, unit tests and a release build.
on:
  push:
    branches:
      - master
      - tmp
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔑 Set up Keystore
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os, re, sys
          raw = os.environ.get('KEYSTORE_BASE64', '').strip()
          if raw:
              cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              missing_padding = len(cleaned) % 4
              if missing_padding:
                  cleaned += '=' * (4 - missing_padding)
              try:
                  decoded = base64.b64decode(cleaned)
                  if len(decoded) > 0:
                      with open('app/release.jks', 'wb') as f:
                          f.write(decoded)
                      print(f'Keystore decoded successfully ({len(decoded)} bytes)')
              except Exception as e:
                  print(f'::warning::Failed to decode keystore: {e}', file=sys.stderr)
          else:
              print('No RELEASE_KEYSTORE_BASE64 provided; building with default signing.')
          "

      - name: 🔧 Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: 🔢 Verify versionCode, versionName & Fastlane Changelog
        id: version
        run: python3 .github/scripts/update_version.py --check

      - name: 🏷️ Verify Tag Matches CHANGELOG.md
        if: env.IS_RELEASE == 'true'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          changelog_version="$(grep -m1 -oP '^##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)"
          if [ "$tag_version" != "$changelog_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the newest CHANGELOG.md version ($changelog_version). Tag the commit that contains the release."
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME from commit $GITHUB_SHA"

      - name: 🏷️ Generate Release Notes
        id: release_info
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 .github/scripts/generate_release_notes.py

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: 📦 Build Optimized Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: 📂 Prepare Release Artifacts
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p artifacts
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::No signed APK: set the RELEASE_KEYSTORE_BASE64 secret (unsigned builds are only for F-Droid)."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk artifacts/pynb-${{ steps.release_info.outputs.tag_name }}.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/pynb-latest.apk

      - name: 📤 Upload Build Artifacts
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pynb-APK
          path: artifacts/*.apk

      - name: 🚀 Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # The release belongs to the tag that triggered this run; never to a branch head.
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          body_path: release_body.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Generate Tabular Build Summary
        if: always()
        run: python3 .github/scripts/generate_summary.py
